<div
  class="w-full min-h-[calc(100vh-4rem)] flex justify-center items-start pt-8 md:pt-16 px-4 bg-surface font-sans"
>
  <div class="w-full max-w-5xl">
    <!-- Main Card -->
    <div
      class="bg-white rounded-2xl shadow-card border border-border overflow-hidden"
    >
      <form [formGroup]="translatorForm" (ngSubmit)="translate()">
        <!-- Language Selectors Toolbar -->
        <div
          class="flex items-center justify-between p-2 border-b border-slate-100 bg-slate-50/50"
        >
          <div class="flex-1 flex items-center px-4">
            <select
              formControlName="startLanguage"
              class="w-full h-10 bg-transparent text-sm font-medium text-slate-600 focus:outline-none cursor-pointer hover:text-indigo-600 transition-colors"
            >
              <option
                *ngFor="let language of languageOptions"
                [value]="language.value"
              >
                {{ language.label }}
              </option>
            </select>
          </div>

          <div class="flex items-center justify-center p-2">
            <button
              type="button"
              (click)="switchLanguage()"
              class="p-2 rounded-full hover:bg-slate-200 transition-all text-slate-500"
              title="Swap languages"
            >
              <switch-svg></switch-svg>
            </button>
          </div>

          <div class="flex-1 flex items-center px-4">
            <select
              formControlName="finalLanguage"
              class="w-full h-10 bg-transparent text-sm font-medium text-slate-600 focus:outline-none cursor-pointer hover:text-indigo-600 transition-colors"
            >
              <option
                *ngFor="let language of languageOptions"
                [value]="language.value"
              >
                {{ language.label }}
              </option>
            </select>
          </div>
        </div>

        <!-- Translation Panels -->
        <div
          class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-slate-100"
        >
          <!-- Source Panel -->
          <div class="relative flex flex-col min-h-[250px] p-4 group">
            <textarea
              formControlName="text"
              placeholder="Type or paste text to translate..."
              class="w-full h-full min-h-[180px] text-lg text-slate-800 placeholder-slate-400 bg-transparent border-none focus:ring-0 resize-none overflow-y-auto"
              maxlength="500"
              spellcheck="false"
            ></textarea>

            <!-- Clear Button -->
            <button
              *ngIf="charCount.value > 0"
              type="button"
              (click)="clearText()"
              class="absolute top-4 right-4 p-1.5 rounded-full bg-slate-100/50 text-slate-400 hover:bg-slate-200 hover:text-slate-600 transition-all"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </button>

            <!-- Bottom Source Actions -->
            <div
              class="mt-4 flex items-center justify-between text-xs text-slate-400"
            >
              <span>{{ charCount.value }} / 500 characters</span>
            </div>
          </div>

          <!-- Target Panel -->
          <div class="relative flex flex-col min-h-[250px] p-4 bg-slate-50/30">
            <div
              *ngIf="!showResult.value && !isLoading.value"
              class="flex-grow flex items-center justify-center text-slate-400 text-lg font-light italic"
            >
              Translation will appear here...
            </div>

            <div
              *ngIf="isLoading.value"
              class="flex-grow flex items-center justify-center"
            >
              <div class="animate-pulse flex space-x-2">
                <div class="h-2 w-2 bg-slate-300 rounded-full"></div>
                <div class="h-2 w-2 bg-slate-300 rounded-full"></div>
                <div class="h-2 w-2 bg-slate-300 rounded-full"></div>
              </div>
            </div>

            <div
              *ngIf="showResult.value && !isLoading.value"
              class="w-full h-full min-h-[180px] text-lg text-indigo-900 break-words whitespace-pre-wrap select-text"
            >
              {{ translationData.value.translation }}
            </div>

            <!-- Copy Button -->
            <div class="mt-4 flex items-center justify-end">
              <button
                *ngIf="showResult.value"
                type="button"
                (click)="copyToClipboard(translationData.value.translation)"
                class="p-2 rounded-lg hover:bg-slate-200 transition-all text-slate-500 flex items-center gap-1.5 text-xs font-medium"
                title="Copy to clipboard"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
                  />
                </svg>
                <span>Copy</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <div
          class="p-4 bg-slate-50 border-t border-slate-100 flex justify-center md:justify-end"
        >
          <button
            [disabled]="translatorForm.invalid || isLoading.value"
            class="group relative w-full md:w-auto px-10 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white rounded-xl font-semibold transition-all shadow-lg shadow-indigo-200 flex items-center justify-center gap-2 overflow-hidden"
            type="submit"
          >
            <span *ngIf="!isLoading.value">Translate</span>
            <span *ngIf="isLoading.value" class="flex items-center gap-2">
              <svg
                class="animate-spin h-5 w-5 text-white"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
              Translating...
            </span>
          </button>
        </div>
      </form>
    </div>

    <!-- Info Footer -->
    <div class="mt-8 text-center text-slate-400 text-sm">
      <p>Modern, simple, and elegant translator.</p>
    </div>
  </div>
</div>
